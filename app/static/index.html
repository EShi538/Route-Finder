<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route Finder</title>
<link rel="stylesheet" href="/static/leaflet/leaflet.css">
<script src="/static/leaflet/leaflet.js"></script>
<style>
  :root {
    --bg: #f6f5f2; --panel: #fff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #fc5200; --accent-soft: #fff0e8; --route: #8a8781;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
  header .powered { margin-left: auto; align-self: center; display: block; height: 16px; width: auto; }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  header span { color: var(--muted); font-size: 14px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px 1fr; }
  aside { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); }
  form { padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; border-bottom: 1px solid var(--line); }
  label { display: flex; flex-direction: column; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; gap: 4px; }
  label.full { grid-column: 1 / -1; }
  input, select { width: 100%; min-width: 0; font: inherit; text-transform: none; letter-spacing: 0; color: var(--ink); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .row { grid-column: 1 / -1; display: flex; gap: 8px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; flex: 1; }
  button.ghost { background: var(--accent-soft); color: var(--accent); }
  button:disabled { opacity: 0.6; cursor: wait; }
  #account { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; min-height: 58px; }
  #account .who { flex: 1; min-width: 0; color: var(--muted); }
  #account .who b { color: var(--ink); font-weight: 600; }
  #account button { padding: 7px 12px; font-size: 13px; }
  #account.signed-out { flex-direction: column; align-items: flex-start; padding-block: 16px; }
  a.connect { display: block; line-height: 0; border-radius: 4px; }
  a.connect:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #status { padding: 14px 20px; color: var(--muted); font-size: 14px; }
  #status a { color: var(--accent); }
  ol { list-style: none; margin: 0; padding: 0 12px 20px; }
  li.card { padding: 14px; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  li.card:hover, li.card.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .top { display: flex; gap: 10px; align-items: flex-start; }
  .rank { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
  li.active .rank { background: var(--accent); }
  .name { font-weight: 650; flex: 1; }
  a.view-strava { display: inline-block; margin: 10px 0 0 36px; font-size: 13px; font-weight: 700; color: #fc5200; text-decoration: none; }
  a.view-strava:hover { text-decoration: underline; }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }
  .stats { display: flex; gap: 14px; margin: 8px 0 0 36px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 600; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); margin: 10px 0 0 36px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .why { margin: 10px 0 0 36px; display: flex; flex-wrap: wrap; gap: 6px; }
  .why span { font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); }
  details.prio { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
  details.prio summary { cursor: pointer; padding: 10px 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; display: flex; justify-content: space-between; align-items: center; }
  details.prio summary::marker { content: ""; }
  details.prio summary::after { content: "▸"; transition: transform .15s; }
  details.prio[open] summary::after { transform: rotate(90deg); }
  .prio-list { display: grid; gap: 10px; padding-bottom: 12px; }
  .prio-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; font-size: 13px; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .prio-row span { color: var(--ink); }
  .prio-row output { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; font-size: 12px; min-width: 3ch; text-align: right; }
  .prio-row input[type=range] { grid-column: 1 / -1; padding: 0; border: 0; accent-color: var(--accent); }
  .prio-row input[type=range]:focus { outline-offset: 2px; }
  .prio-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .prio-foot button { padding: 4px 8px; font-size: 12px; background: none; color: var(--accent); }
  #map { height: 100%; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #map { height: 50vh; order: -1; }
  }
</style>
</head>
<body>
<header>
  <h1>Route Finder</h1><span>Route recommendations from your Strava history</span>
  <!-- Strava brand guidelines: required wherever Strava data is shown; kept apart from and smaller than our own name. -->
  <img class="powered" src="/static/strava/powered-by-strava.svg" width="158" height="16" alt="Powered by Strava">
</header>
<main>
  <aside>
    <div id="account" aria-live="polite"><span class="who">Checking sign-in…</span></div>
    <form id="form">
      <label>Sport
        <select id="sport"><option value="ride">Ride</option><option value="run">Run</option><option value="walk">Walk / Hike</option></select>
      </label>
      <label>Distance (mi) <input id="distance" type="number" min="0.5" max="300" step="any" value="25" required></label>
      <label>Max climbing (ft) <input id="elev" type="number" min="0" max="50000" step="any" placeholder="any"></label>
      <label>Max start (mi) <input id="maxstart" type="number" min="0.1" max="60" step="any" value="6" required></label>
      <label>Latitude <input id="lat" type="number" min="-90" max="90" step="any" value="47.66" required></label>
      <label>Longitude <input id="lng" type="number" min="-180" max="180" step="any" value="-122.30" required></label>
      <details class="prio" id="prio">
        <summary>Priorities</summary>
        <div class="prio-list" id="prio-list"></div>
      </details>
      <div class="row">
        <button type="button" class="ghost" id="locate">Use my location</button>
        <button type="submit" class="primary" id="go">Find routes</button>
      </div>
    </form>
    <div id="status"></div>
    <ol id="results"></ol>
  </aside>
  <div id="map"></div>
</main>

<script>
// Decode a Google-encoded polyline (Strava's map.summary_polyline) into [lat, lng] pairs.
function decodePolyline(str) {
  const points = [];
  let index = 0, lat = 0, lng = 0;
  while (index < str.length) {
    for (const which of [0, 1]) {
      let shift = 0, result = 0, byte;
      do {
        byte = str.charCodeAt(index++) - 63;
        result |= (byte & 0x1f) << shift;
        shift += 5;
      } while (byte >= 0x20);
      const delta = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (which === 0) lat += delta; else lng += delta;
    }
    points.push([lat / 1e5, lng / 1e5]);
  }
  return points;
}

const $ = (id) => document.getElementById(id);
const map = L.map("map").setView([47.66, -122.30], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
}).addTo(map);

let layers = [];
let startMarker = null;

const ROUTE_TYPES = { loop: "Loop", out_and_back: "Out and back", point_to_point: "Point to point" };
const ROUTE_STYLE = { color: "#8a8781", weight: 3, opacity: 0.55 };
const ACTIVE_STYLE = { color: "#fc5200", weight: 5, opacity: 1 };

function setActive(i) {
  layers.forEach((layer, j) => {
    if (!layer) return;
    layer.setStyle(j === i ? ACTIVE_STYLE : ROUTE_STYLE);
    if (j === i) layer.bringToFront();
  });
  document.querySelectorAll("li.card").forEach((el, j) => el.classList.toggle("active", j === i));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function render(routes, lat, lng) {
  layers.forEach((l) => l && l.remove());
  layers = [];
  if (startMarker) startMarker.remove();
  startMarker = L.circleMarker([lat, lng], { radius: 7, color: "#1d1d1b", fillColor: "#fff", fillOpacity: 1, weight: 3 })
    .addTo(map).bindTooltip("Your start");

  const list = $("results");
  list.innerHTML = "";
  const bounds = L.latLngBounds([[lat, lng]]);

  routes.forEach((r, i) => {
    const pts = r.polyline ? decodePolyline(r.polyline) : [];
    const layer = pts.length ? L.polyline(pts, ROUTE_STYLE).addTo(map) : null;
    if (layer) {
      bounds.extend(layer.getBounds());
      layer.on("click", () => setActive(i));
    }
    layers.push(layer);

    const li = document.createElement("li");
    li.className = "card";
    li.innerHTML = `
      <div class="top">
        <div class="rank">${i + 1}</div>
        <div class="name">${escapeHtml(r.name)}</div>
        <div class="score">${Math.round(r.score * 100)}</div>
      </div>
      <div class="stats">
        <span><b>${r.distance_mi.toFixed(1)}</b> mi</span>
        <span><b>${r.elev_gain_ft.toLocaleString("en-US")}</b> ft up</span>
        <span><b>${r.start_mi_away}</b> mi away</span>
        ${ROUTE_TYPES[r.route_type] ? `<span>${ROUTE_TYPES[r.route_type]}</span>` : ""}
      </div>
      <div class="bar"><i style="width:${Math.round(r.score * 100)}%"></i></div>
      <div class="why">${r.why.map((w) => `<span>${escapeHtml(w)}</span>`).join("")}</div>
      <a class="view-strava" href="${escapeHtml(r.strava_activity_url)}" target="_blank" rel="noopener">View on Strava</a>`;
    li.addEventListener("mouseenter", () => setActive(i));
    li.addEventListener("click", (e) => {
      if (e.target.tagName === "A") return;
      setActive(i);
      if (layer) map.fitBounds(layer.getBounds(), { padding: [30, 30] });
    });
    list.appendChild(li);
  });

  map.fitBounds(bounds, { padding: [30, 30] });
  if (routes.length) setActive(0);
}

// Priorities: how much each factor counts toward the score. Sliders are relative;
// the percentage next to each is its share of the total, which is what the server uses.
const FACTORS = [
  { key: "distance", label: "Similar distance", def: 40 },
  { key: "proximity", label: "Starts near me", def: 25 },
  { key: "elevation", label: "Under my max elevation gain", def: 15 },
  { key: "novelty", label: "Haven't done it lately", def: 20 },
];
const weights = Object.fromEntries(FACTORS.map((f) => [f.key, f.def]));
try { Object.assign(weights, JSON.parse(localStorage.getItem("weights") || "{}")); } catch {}

function buildPriorities() {
  const list = $("prio-list");
  list.innerHTML = FACTORS.map((f) => `
    <label class="prio-row">
      <span>${f.label}</span><output id="share-${f.key}"></output>
      <input type="range" id="w-${f.key}" min="0" max="100" step="5" value="${weights[f.key]}" aria-label="${f.label}">
    </label>`).join("") + `
    <div class="prio-foot"><span id="prio-note"></span><button type="button" id="prio-reset">Reset</button></div>`;
  FACTORS.forEach((f) => $(`w-${f.key}`).addEventListener("input", (e) => {
    weights[f.key] = +e.target.value;
    onWeightsChanged();
  }));
  $("prio-reset").addEventListener("click", () => {
    FACTORS.forEach((f) => { weights[f.key] = f.def; $(`w-${f.key}`).value = f.def; });
    onWeightsChanged();
  });
  showShares();
}

function showShares() {
  const total = FACTORS.reduce((t, f) => t + weights[f.key], 0);
  FACTORS.forEach((f) => { $(`share-${f.key}`).textContent = total ? `${Math.round(weights[f.key] / total * 100)}%` : "–"; });
  $("prio-note").textContent = total ? "" : "Turn at least one up";
}

let researchTimer = null;
function onWeightsChanged() {
  showShares();
  try { localStorage.setItem("weights", JSON.stringify(weights)); } catch {}
  // Re-rank live once there are results on screen.
  if ($("results").children.length && FACTORS.some((f) => weights[f.key] > 0)) {
    clearTimeout(researchTimer);
    researchTimer = setTimeout(() => $("form").requestSubmit(), 250);
  }
}
buildPriorities();

async function search(e) {
  e.preventDefault();
  if (!FACTORS.some((f) => weights[f.key] > 0)) {
    $("prio").open = true;
    $("status").textContent = "Turn at least one priority above 0.";
    return;
  }
  if (!account) { showSignedOut(); return; }
  const lat = parseFloat($("lat").value), lng = parseFloat($("lng").value);

  const params = new URLSearchParams({
    lat, lng, sport: $("sport").value,
    distance_mi: $("distance").value, max_start_mi: $("maxstart").value,
    include_polyline: "true", limit: "8",
  });
  if ($("elev").value) params.set("max_elev_ft", $("elev").value);
  FACTORS.forEach((f) => params.set(`w_${f.key}`, weights[f.key]));

  $("go").disabled = true;
  $("status").textContent = "Finding routes…";
  try {
    const res = await fetch(`/me/recommendations?${params}`);
    const body = await res.json();
    if (res.status === 401) {
      showSignedOut();
      render([], lat, lng);
    } else if (!res.ok) {
      const detail = Array.isArray(body.detail) ? body.detail.map((d) => `${d.loc.at(-1)}: ${d.msg}`).join("; ") : body.detail;
      $("status").textContent = `Error: ${detail}`;
    } else if (body.length === 0) {
      $("status").textContent = "No matching routes. Try a different distance or a larger max start distance.";
      render([], lat, lng);
    } else {
      $("status").textContent = `${body.length} route${body.length > 1 ? "s" : ""} found. Hover a card to highlight it.`;
      render(body, lat, lng);
    }
  } catch (err) {
    $("status").textContent = "Couldn't reach the server. Is uvicorn running?";
  } finally {
    $("go").disabled = !account;
  }
}

// --- Account: who is signed in, sync, log out --------------------------------
let account = null;   // {athlete_id, name, activities} while signed in

function showSignedOut() {
  account = null;
  $("go").disabled = true;
  $("account").className = "signed-out";
  $("account").innerHTML = '<span class="who">Sign in to see routes from your Strava history.</span><a class="connect" href="/auth/login"><img src="/static/strava/connect-with-strava.svg" width="237" height="48" alt="Connect with Strava"></a>';
  $("status").textContent = "";
}

function showAccount() {
  $("go").disabled = false;
  $("account").className = "";
  const n = account.activities.toLocaleString("en-US");
  $("account").innerHTML = `<span class="who"><b>${escapeHtml(account.name || "Signed in")}</b> · ${n} activities</span>
    <button type="button" class="ghost" id="sync">Sync now</button>
    <button type="button" class="ghost" id="logout">Log out</button>`;
  $("sync").addEventListener("click", syncNow);
  $("logout").addEventListener("click", logOut);
}

async function loadAccount() {
  try {
    const res = await fetch("/me");
    if (!res.ok) return showSignedOut(), false;
    account = await res.json();
    showAccount();
    return true;
  } catch {
    $("account").innerHTML = '<span class="who">Couldn\'t reach the server. Is uvicorn running?</span>';
    return false;
  }
}

async function syncNow() {
  $("sync").disabled = true;
  $("sync").textContent = "Syncing…";
  $("status").textContent = "Importing activities from Strava…";
  try {
    const res = await fetch("/me/sync", { method: "POST" });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401) return showSignedOut();
    $("status").textContent = res.ok
      ? `Synced ${body.activities_stored.toLocaleString("en-US")} activities from Strava.`
      : `Sync failed: ${body.detail || res.status}`;
  } catch {
    $("status").textContent = "Couldn't reach the server.";
  }
  await loadAccount();
}

async function logOut() {
  await fetch("/auth/logout", { method: "POST" }).catch(() => {});
  render([], parseFloat($("lat").value), parseFloat($("lng").value));
  $("results").innerHTML = "";
  showSignedOut();
}

$("form").addEventListener("submit", search);
$("locate").addEventListener("click", () => {
  if (!navigator.geolocation) return;
  $("status").textContent = "Getting your location…";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      $("lat").value = pos.coords.latitude.toFixed(5);
      $("lng").value = pos.coords.longitude.toFixed(5);
      $("status").textContent = "Location set. Click Find routes.";
    },
    () => { $("status").textContent = "Couldn't get your location; enter it manually."; },
  );
});

try { localStorage.removeItem("athleteId"); } catch {}  // no longer used: sign-in replaced the ID box

// Shareable links (distance and maxstart in miles, elev in feet): /?distance=25&sport=ride&lat=..&lng=.. fills the form and searches.
const q = new URLSearchParams(location.search);
const fields = { distance: "distance", sport: "sport", lat: "lat", lng: "lng", elev: "elev", maxstart: "maxstart" };
for (const [param, id] of Object.entries(fields)) if (q.has(param)) $(id).value = q.get(param);
// ...and w_distance=60&w_novelty=0 etc. set the priorities.
FACTORS.forEach((f) => {
  const v = parseFloat(q.get(`w_${f.key}`));
  if (v >= 0 && v <= 100) { weights[f.key] = v; $(`w-${f.key}`).value = v; }
});
showShares();

$("go").disabled = true;
loadAccount().then(async (signedIn) => {
  if (!signedIn) return;
  if (account.activities === 0) {
    await syncNow();                       // first visit after connecting: import right away
  } else if (Object.keys(fields).some((p) => q.has(p))) {
    $("form").requestSubmit();             // shareable link: search straight away
  } else {
    $("status").textContent = "Set a distance and click Find routes.";
  }
});
</script>
</body>
</html>
